name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Preserve the required-check name; this now verifies compilation only.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
