name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --test-shard=${{ matrix.shard }}/4

  # Keep the original required-check name. A skipped or cancelled shard is not a pass.
  verify:
    name: verify
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all test shards
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          printf 'Test shards: %s\n' "$TEST_RESULT"
          test "$TEST_RESULT" = success
